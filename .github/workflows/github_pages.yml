name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main # Cambia a master si tu rama principal se llama así

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Compatible con la versión de Vite 8 que utilizas
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Static Site
        run: npm run build
        # Esto ejecutará "vite build" y guardará los archivos estáticos en la carpeta /dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # La carpeta generada automáticamente por Vite
          branch: gh-pages
